<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Bodyweight tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14202b;--s1:#1b2a37;--s2:#243645;--ln:#33485a;
  --tx:#eef2f4;--mu:#9fb2c1;--ac:#f4c95d;--ac-ink:#2b2208;
  --hd:'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --bd:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 var(--bd)}
h1,h2,h3,h4,p,ul{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
main{max-width:560px;margin:0 auto;padding:18px 16px 160px}
.mu{color:var(--mu)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);font:600 17px/1 var(--bd)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.btn.ghost{background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:15px}
.btn.danger{border-color:#b86a6a;color:#ffb8b8;background:transparent}
.lnk{background:none;border:0;color:var(--ac);font:600 15px/1 var(--bd);min-height:36px;padding:0 4px}
.back{background:none;border:0;padding:0;min-height:44px;color:var(--mu);font:600 16px var(--bd)}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(4,1fr);background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs button{height:60px;border:0;background:none;color:var(--mu);font:600 22px/1 var(--hd)}
#tabs button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}

/* rest timer */
.rest{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--s2);border-top:1px solid var(--ln)}
.rest[hidden]{display:none}
.rbar{height:4px;background:var(--bg)}
.rbar i{display:block;height:100%;width:0;background:var(--ac)}
.rrow{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px}
.rrow .rl{color:var(--mu)}
#restT{font:700 34px/1 var(--hd);min-width:64px;margin-right:auto}
.rest.fin #restT{color:var(--ac)}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

/* first-run sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(32px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px))}
.sheet[hidden]{display:none}
.sheet .in{max-width:520px;margin:0 auto}
.sheet h1{font:700 54px/.95 var(--hd);margin-bottom:12px}
.sheet p{color:var(--mu);margin-bottom:22px}
.pick{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px}
.pick b{display:block;font:700 30px/1 var(--hd);margin-bottom:6px}
.pick span{color:var(--mu)}

/* headings */
.pg{font:700 48px/1 var(--hd)}
.lead{margin:8px 0 18px;color:var(--mu)}
.sec{font:700 32px/1 var(--hd);margin:30px 0 12px}
.grp{font:600 20px/1 var(--hd);color:var(--mu);margin:16px 0 2px}

/* cards */
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:0 0 14px}
.card.warn{border-color:var(--ac)}

/* today */
.hero{display:flex;align-items:flex-end;gap:20px;margin:4px 0 24px}
.wk{display:flex;flex-direction:column}
.wl{font:600 24px/1 var(--hd);color:var(--mu)}
.wn{font:700 120px/.8 var(--hd);color:var(--ac)}
.hs{flex:1;padding-bottom:6px}
.hp{font:600 22px/1.1 var(--hd);margin-bottom:12px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg i{height:10px;border-radius:5px;background:var(--s2)}
.seg i.on{background:var(--ac)}
.seg i.half{background:var(--mu)}
.day{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:0 0 14px}
.day.next{border-color:var(--ac)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dn{font:700 36px/1 var(--hd)}
.ds{color:var(--mu);font-size:15px}
.day.done .ds,.day.next .ds{color:var(--ac)}
.db{color:var(--mu);margin:4px 0 12px}
.dl{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:5px}
.dl li{position:relative;padding-left:16px}
.dl li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--mu)}

/* workout session */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sh{font:700 48px/1 var(--hd);margin:2px 0 4px}
.ex{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:16px 0}
.ex h3{font:700 32px/1.05 var(--hd)}
.rx{color:var(--ac);font:600 21px/1.2 var(--hd);margin-top:4px}
.look{display:inline-block;margin-top:6px;color:var(--mu);font-size:14px}
.sets{display:grid;gap:10px;margin:14px 0 12px}
.set{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center}
.sl{color:var(--mu)}
.set.on .sl{color:var(--tx)}
.chk{width:48px;height:48px;border-radius:50%;border:2px solid var(--mu);background:transparent;display:grid;place-items:center;padding:0}
.chk svg{width:24px;height:24px;fill:none;stroke:var(--ac-ink);stroke-width:3;opacity:0}
.chk.on{background:var(--ac);border-color:var(--ac)}
.chk.on svg{opacity:1}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);font:600 22px/1 var(--bd);padding:0}
.stp input{width:64px;height:44px;text-align:center;font:700 24px/1 var(--hd);background:var(--bg);border:1px solid var(--ln);border-radius:12px;-moz-appearance:textfield;appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.exa{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.nl{display:block;color:var(--mu);font-size:14px}
.nl textarea,.blob{display:block;width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:16px;resize:vertical}
.nl textarea{min-height:64px}
.blob{font:13px/1.35 ui-monospace,Menlo,Consolas,monospace;margin-top:12px}
.fin-note{color:var(--ac);margin:4px 0 8px}

/* plan */
.dayh{font:700 36px/1 var(--hd);margin:28px 0 2px}
.dayb{color:var(--mu);margin-bottom:12px}
.mv{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.slot{font:600 20px/1.1 var(--hd);color:var(--mu)}
.mrx{font:700 20px/1.1 var(--hd);color:var(--ac);white-space:nowrap}
.ladder{display:grid;gap:6px}
.rung{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;min-height:48px;padding:8px 12px;border-radius:12px;border:1px solid transparent;background:var(--s2)}
.rung .rl{color:var(--mu);font-size:14px;flex:none}
.rung .rn{text-align:right;font-weight:500}
.rung.on{border-color:var(--ac);background:var(--bg)}
.rung.on .rn{color:var(--ac);font-weight:700}

/* progress */
.sug{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--ln)}
.grp + .sug{border-top:0}
.sn{font-weight:600}
.sx{color:var(--mu);font-size:15px}
.sr{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.chip{display:inline-block;padding:5px 10px;border-radius:999px;background:var(--s2);font-size:14px;color:var(--mu);white-space:nowrap}
.chip.up{background:var(--ac);color:var(--ac-ink);font-weight:600}
select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);padding:0 12px;font-size:16px}
.chart{display:block;width:100%;height:auto;margin-top:12px}
.chart .bar{fill:var(--ac)}
.chart .bar.zero{fill:var(--s2)}
.chart text{fill:var(--mu);font:600 12px var(--bd)}
.chart text.val{fill:var(--tx)}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--ln)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--s1)}
th{font-weight:600;color:var(--mu)}
td.cur,th.cur{color:var(--ac)}
tr.g td{font:600 18px/1 var(--hd);color:var(--mu);padding-top:14px}
sup.up{color:var(--ac);font-size:10px;margin-left:2px}
.wkb{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:56px;padding:0 2px;background:none;border:0;border-top:1px solid var(--ln);text-align:left}
.wkb b{font:700 24px/1 var(--hd)}
.wkb span{color:var(--mu);font-size:15px}
.hse{padding:0 2px 14px}
.hse p{margin-bottom:4px}
.hse ul{list-style:none;padding:0;display:grid;gap:4px}
.hse em{display:block;color:var(--mu);font-style:normal;font-size:14px}

/* cardio */
.act{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:0 0 14px}
.act h2{font:700 36px/1 var(--hd)}
.act .ds{display:block;margin:4px 0 10px;color:var(--mu);font-size:15px}
.act p{color:var(--mu);margin:0 0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ln);background:var(--s2);font:600 16px/1 var(--bd)}
.pill.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.num{display:block;width:100%;min-height:48px;margin-top:6px;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:0 12px;font-size:18px}
.set.two{grid-template-columns:48px 1fr}
.btn[disabled]{opacity:.4;cursor:default}

/* day strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:0 0 14px}
.dcell{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:70px;padding:8px 0 6px;border-radius:12px;border:1px solid var(--ln);background:var(--s1)}
.dcell.tdy{border-color:var(--mu)}
.dcell.sel{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.dcell[disabled]{opacity:.4;cursor:default}
.dw{font-size:12px;color:var(--mu)}
.dcell.sel .dw{color:var(--ac-ink)}
.dd{font:700 22px/1 var(--hd)}
.dots{display:flex;gap:3px;min-height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.dots .a{background:var(--ac)}
.dots .b{background:var(--mu)}
.dcell.sel .dots i{background:var(--ac-ink)}
.bar{height:10px;border-radius:5px;background:var(--s2)}
.bar i{display:block;height:100%;border-radius:5px;background:var(--ac)}
select.mini{width:auto;min-height:44px;padding:0 8px}
.dph{font:700 26px/1 var(--hd);margin:0 0 8px}
.ti{display:flex;align-items:center;gap:10px}
.ic svg{display:block;width:40px;height:40px;color:var(--ac)}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.brand b{font:700 24px/1 var(--hd)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--ac);display:grid;place-items:center;flex:none}
.logo .ic svg{width:28px;height:28px;color:var(--ac-ink)}
.logo.big{width:72px;height:72px;border-radius:20px;margin-bottom:18px}
.logo.big .ic svg{width:48px;height:48px}
</style>
</head>
<body>
<main id="app"></main>

<div id="rest" class="rest" hidden>
  <div class="rbar"><i id="restBar"></i></div>
  <div class="rrow">
    <span class="rl">Rest</span>
    <b id="restT">1:00</b>
    <button class="btn sm" data-a="rest-add" data-n="-15">-15s</button>
    <button class="btn sm" data-a="rest-add" data-n="15">+15s</button>
    <button class="btn sm ghost" data-a="rest-skip">Skip</button>
  </div>
</div>

<nav id="tabs" aria-label="Sections">
  <button data-a="tab" data-t="today">Today</button>
  <button data-a="tab" data-t="plan">Plan</button>
  <button data-a="tab" data-t="cardio">Cardio</button>
  <button data-a="tab" data-t="progress">Progress</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<div id="start" class="sheet" hidden></div>

<script>
(function(){
'use strict';

var KEY='bw-tracker-v1';
var LEVELS=['Beginner','Intermediate','Advanced'];
var MINSETS=3, MAXSETS=4;
var RESTS=[30,45,60,90,120,180];

var DAYS=[
  {id:'push',name:'Push',blurb:'Chest, shoulders, triceps'},
  {id:'pull',name:'Pull',blurb:'Back, biceps, rear shoulders'},
  {id:'legs',name:'Legs',blurb:'Quads, glutes, hamstrings, calves'},
  {id:'core',name:'Core',blurb:'Abs, obliques, trunk stability'}
];

// variant = [name, unit, start target, cap, eachSide]
var MOVES=[
  {id:'push1',day:'push',slot:'Horizontal push',lv:[['Incline Push-Up','reps',8,15],['Push-Up','reps',8,15],['Archer Push-Up','reps',5,10,1]]},
  {id:'push2',day:'push',slot:'Vertical push',lv:[['Pike Push-Up','reps',6,12],['Feet-Elevated Pike Push-Up','reps',6,12],['Wall Handstand Push-Up','reps',3,8]]},
  {id:'push3',day:'push',slot:'Triceps',lv:[['Bench Dip','reps',8,15],['Diamond Push-Up','reps',6,12],['Bodyweight Triceps Extension','reps',6,12]]},
  {id:'push4',day:'push',slot:'Shoulder stability',lv:[['Scapular Push-Up','reps',8,15],['Plank Shoulder Tap','reps',10,20],['Pseudo Planche Push-Up','reps',5,10]]},
  {id:'pull1',day:'pull',slot:'Horizontal pull',lv:[['Doorway Towel Row','reps',8,15],['Table Inverted Row','reps',8,15],['Archer Inverted Row','reps',4,10,1]]},
  {id:'pull2',day:'pull',slot:'Vertical pull',st:[1,3,4],hint:'Bar steps: hang first, then scapular pulls, then jump up and lower slowly, then real negatives and pull-ups. Move up when you can finish every set.',lv:[['Reverse Snow Angel','reps',8,15],['Dead Hang','sec',10,30],['Scapular Pull-Up','reps',5,12],['Jumping Pull-Up','reps',3,8],['Negative Pull-Up','reps',3,6],['Pull-Up','reps',2,10]]},
  {id:'pull3',day:'pull',slot:'Biceps',lv:[['Isometric Towel Curl','sec',20,40],['Underhand Inverted Row','reps',8,15],['Chin-Up','reps',3,10]]},
  {id:'pull4',day:'pull',slot:'Upper back',lv:[['Prone Y Raise','reps',8,15],['Prone Y-T-W Raise','reps',6,12],['Reverse Plank','sec',20,45]]},
  {id:'legs1',day:'legs',slot:'Squat',lv:[['Bodyweight Squat','reps',10,20],['Bulgarian Split Squat','reps',6,12,1],['Pistol Squat','reps',3,8,1]]},
  {id:'legs2',day:'legs',slot:'Hinge',lv:[['Glute Bridge','reps',10,20],['Single-Leg Glute Bridge','reps',8,15,1],['Nordic Hamstring Curl','reps',3,8]]},
  {id:'legs3',day:'legs',slot:'Lunge',lv:[['Reverse Lunge','reps',8,15,1],['Jumping Lunge','reps',6,12,1],['Skater Squat','reps',4,10,1]]},
  {id:'legs4',day:'legs',slot:'Calves',lv:[['Calf Raise','reps',15,30],['Single-Leg Calf Raise','reps',10,20,1],['Deficit Single-Leg Calf Raise','reps',10,20,1]]},
  {id:'core1',day:'core',slot:'Plank',lv:[['Knee Plank','sec',20,45],['Plank','sec',30,60],['Long-Lever Plank','sec',20,45]]},
  {id:'core2',day:'core',slot:'Abs',lv:[['Dead Bug','reps',8,15],['Hollow Body Hold','sec',15,40],['V-Up','reps',8,15]]},
  {id:'core3',day:'core',slot:'Leg raise',lv:[['Bent-Knee Leg Raise','reps',8,15],['Lying Leg Raise','reps',8,15],['Windshield Wiper','reps',6,12]]},
  {id:'core4',day:'core',slot:'Side core',lv:[['Knee Side Plank','sec',15,40,1],['Side Plank','sec',20,45,1],['Side Plank Hip Dip','reps',8,15,1]]}
];
var moveById={};
MOVES.forEach(function(m){moveById[m.id]=m;});

// swim: [total, chunk, rest sec] in pool units; run: [run min, walk min, rounds]; bike: steady {s} or intervals {w,h,e,r,c}
var CARDIO={
  swim:{name:'Swim',steps:[[150,25,45],[200,50,45],[300,50,30],[400,100,30],[500,100,25],[600,200,20],[800,200,15],[1000,500,60]]},
  run:{name:'Run',steps:[[1,2,8],[2,2,6],[3,2,5],[5,2,4],[8,2,3],[12,2,2],[20,0,1],[25,0,1],[30,0,1]]},
  bike:{name:'Bike',steps:[{s:20},{s:25},{s:30},{w:5,h:1,e:2,r:5,c:5},{w:5,h:1,e:2,r:7,c:5},{w:5,h:2,e:2,r:6,c:5},{w:5,h:2,e:2,r:8,c:5},{s:45}]}
};
var ACTS=['swim','run','bike'];
var BT=['push','pull','legs','core','cardio'];
function defaultSched(){return [[],['push','core'],['pull','cardio'],['legs','core'],['push','pull'],['legs','cardio'],['cardio','core']];}
function cname(a){return CARDIO[a]?CARDIO[a].name:(a==='ball'?'Basketball':'Other');}
var ICON={
  push:'<circle cx="9" cy="17" r="3.5"/><path d="M13 20L38 28M16 22v14M38 28l4 7M4 38h40"/>',
  pull:'<path d="M8 7h32M19 7l5 11 5-11"/><circle cx="24" cy="23" r="3.5"/><path d="M24 27v10M24 37l-5 8M24 37l5 8"/>',
  legs:'<circle cx="24" cy="9" r="3.5"/><path d="M24 13v12M24 16l-9-2M24 16l9-2M24 25l-9 5v12M24 25l9 5v12"/>',
  core:'<circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="8"/><circle cx="24" cy="24" r="1.5" fill="currentColor"/>',
  cardio:'<path d="M24 41C8 30 6 17 14 12c5-3 9 0 10 4 1-4 5-7 10-4 8 5 6 18-10 29z"/><path d="M12 25h8l3-6 4 11 3-5h6"/>'
};
function ic(t){return '<span class="ic" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">'+(ICON[t]||'')+'</svg></span>';}
var TIPS=['Review day. Look at the week, then rest.','Quality over quantity. Stop one or two reps before you shake.','Pulling progress is slow. Hangs count.','Legs carry basketball. Land softly.','Two blocks is plenty. Do them well.','Easy cardio should feel like you could still talk.','Short and honest beats long and skipped.'];

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clone(o){return JSON.parse(JSON.stringify(o));}
function pad(n){return (n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(iso){
  var p=String(iso||'').split('-').map(Number);
  if(p.length!==3||!p[0]) return '';
  return new Date(p[0],p[1]-1,p[2]).toLocaleDateString(undefined,{month:'short',day:'numeric'});
}
function dayName(id){var d=DAYS.filter(function(x){return x.id===id;})[0];return d?d.name:id;}
function V(m,lv){return m.lv[lv];}

function rxText(m,p){var v=V(m,p.lv);return p.sets+' \u00d7 '+p.tgt+' '+unitWord(v[1])+(v[4]?' each side':'');}

/* ---------- state ---------- */
function freshState(){
  var s={v:3,started:false,week:1,rest:60,plan:{},weeks:[],sessions:[],cardio:freshCardio(),holds:{},sched:defaultSched(),extra:{}};
  MOVES.forEach(function(m){s.plan[m.id]=rx(m,0);});
  s.weeks.push({n:1,start:today(),plan:clone(s.plan)});
  return s;
}
function normalize(raw){
  var s=freshState();
  if(!raw||typeof raw!=='object') return s;
  s.started=!!raw.started;
  s.week=Math.max(1,parseInt(raw.week,10)||1);
  s.rest=RESTS.indexOf(raw.rest)>=0?raw.rest:60;
  s.cardio=normCardio(raw.cardio);
  MOVES.forEach(function(m){
    var p=raw.plan&&raw.plan[m.id];
    if(p){
      var lv=Math.min(m.lv.length-1,Math.max(0,parseInt(p.lv,10)||0));
      s.plan[m.id]={lv:lv,sets:Math.min(MAXSETS,Math.max(1,parseInt(p.sets,10)||MINSETS)),tgt:Math.max(1,parseInt(p.tgt,10)||V(m,lv)[2])};
    }
  });
  var ss=Array.isArray(raw.sessions)?raw.sessions:[];
  s.sessions=ss.filter(function(x){
    return x&&x.id&&DAYS.some(function(d){return d.id===x.day;})&&x.ex&&typeof x.ex==='object'&&
      Object.keys(x.ex).every(function(k){return moveById[k]&&x.ex[k]&&Array.isArray(x.ex[k].sets);});
  });
  s.weeks=[];
  for(var n=1;n<=s.week;n++){
    var w=null;
    if(Array.isArray(raw.weeks)){raw.weeks.forEach(function(x){if(x&&x.n===n)w=x;});}
    s.weeks.push({n:n,start:(w&&w.start)||today(),plan:(w&&w.plan&&typeof w.plan==='object')?w.plan:clone(s.plan)});
  }
  s.holds=(raw.holds&&typeof raw.holds==='object')?raw.holds:{};
  var rv=parseInt(raw.v,10)||1;
  if(rv<2){
    var mp=[0,4,5];
    var fixLv=function(q){if(q&&typeof q.lv==='number') q.lv=(mp[q.lv]!==undefined?mp[q.lv]:0);};
    s.sessions.forEach(function(x){if(x.ex&&x.ex.pull2) fixLv(x.ex.pull2);});
    s.weeks.forEach(function(w){if(w.plan&&w.plan.pull2) fixLv(w.plan.pull2);});
    s.plan.pull2=rx(moveById.pull2,1);
    if(s.weeks.length&&s.weeks[s.weeks.length-1].plan) s.weeks[s.weeks.length-1].plan.pull2=clone(s.plan.pull2);
  }
  s.sched=(Array.isArray(raw.sched)&&raw.sched.length===7)?raw.sched.map(function(a){return Array.isArray(a)?a.filter(function(t){return BT.indexOf(t)>=0;}).slice(0,3):[];}):defaultSched();
  s.extra=(raw.extra&&typeof raw.extra==='object')?raw.extra:{};
  s.v=3;
  return s;
}
function load(){

  return null;
}
var ui={tab:'today',open:null,chart:null,confirm:null,openWeeks:{},exportText:'',showImport:false,noStore:false,dl:null,cardio:null,csess:null,editPool:false,pd:{len:25,unit:'m'},day:null,notice:'',qc:null};

/* ---------- sessions ---------- */
function getSession(day){
  for(var i=0;i<state.sessions.length;i++){var s=state.sessions[i];if(s.date===curDay()&&s.day===day) return s;}
  return null;
}
function getEx(sid,mid){
  for(var i=0;i<state.sessions.length;i++){if(state.sessions[i].id===sid) return state.sessions[i].ex[mid]||null;}
  return null;
}
function startSession(day){
  var s=getSession(day);
  if(!s){
    s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),week:state.week,day:day,date:curDay(),done:false,ex:{}};
    MOVES.filter(function(m){return m.day===day;}).forEach(function(m){
      var p=state.plan[m.id],v=V(m,p.lv),sets=[];
      for(var i=0;i<p.sets;i++) sets.push({d:false,v:p.tgt});
      s.ex[m.id]={lv:p.lv,name:v[0],unit:v[1],each:!!v[4],tgt:p.tgt,ps:p.sets,note:'',sets:sets};
    });
    state.sessions.push(s);
    save();
  }
  ui.tab='today';ui.open=s.id;
  render();window.scrollTo(0,0);
}
function pruneIfEmpty(sid){
  var s=null,idx=-1;
  state.sessions.forEach(function(x,i){if(x.id===sid){s=x;idx=i;}});
  if(!s||s.done) return;
  var used=Object.keys(s.ex).some(function(k){var e=s.ex[k];return e.note||e.sets.some(function(x){return x.d;});});
  if(!used){state.sessions.splice(idx,1);save();}
}
function dayStatus(dayId){
  var s=getSession(dayId);
  if(!s) return {k:'new',label:'Not started',btn:'Start'};
  var t=0,d=0;
  Object.keys(s.ex).forEach(function(k){t+=s.ex[k].sets.length;d+=s.ex[k].sets.filter(function(x){return x.d;}).length;});
  if(s.done) return {k:'done',label:'Done, '+fmtDate(s.date),btn:'Review'};
  return {k:'run',label:d+' of '+t+' sets, '+fmtDate(s.date),btn:'Continue'};
}

/* ---------- cardio ---------- */
function freshCardio(){return {pool:null,du:'km',step:{swim:0,run:0,bike:0},streak:{swim:0,run:0,bike:0},sessions:[]};}
function normCardio(r){
  var c=freshCardio();
  if(!r||typeof r!=='object') return c;
  if(r.pool&&r.pool.len>=10&&r.pool.len<=100&&(r.pool.unit==='m'||r.pool.unit==='yd')) c.pool={len:+r.pool.len,unit:r.pool.unit};
  if(r.du==='mi') c.du='mi';
  ACTS.forEach(function(a){
    var max=CARDIO[a].steps.length-1;
    if(r.step&&typeof r.step[a]==='number') c.step[a]=Math.min(max,Math.max(0,Math.floor(r.step[a])));
    if(r.streak&&typeof r.streak[a]==='number') c.streak[a]=Math.max(0,Math.floor(r.streak[a]));
  });
  if(Array.isArray(r.sessions)) c.sessions=r.sessions.filter(function(x){return x&&x.id&&(CARDIO[x.act]||x.q)&&Array.isArray(x.blocks);});
  return c;
}
function getCS(id){
  var c=state.cardio.sessions;
  for(var i=0;i<c.length;i++){if(c[i].id===id) return c[i];}
  return null;
}
function cplan(act,step){
  var p=CARDIO[act].steps[step],b=[],i;
  if(act==='swim'){
    var pool=state.cardio.pool;
    if(!pool) return null;
    var L=pool.len,cl=Math.max(1,Math.round(p[1]/L)),n=Math.max(1,Math.round(p[0]/(cl*L))),rest=p[2];
    var word=cl===1?'length':'lengths';
    for(i=0;i<n;i++) b.push({t:'Swim '+cl+' '+word,n:cl,m:0,d:false});
    return {blocks:b,rest:rest,
      sum:n+' \u00d7 '+cl+' '+word+' without stopping'+(rest?', rest '+rest+' sec between':''),
      more:'About '+Math.round(n*cl*L)+' '+pool.unit+' in total.'+(cl%2===0?' That is '+(cl/2)+(cl===2?' lap':' laps')+' each time.':'')};
  }
  if(act==='run'){
    var r=p[0],w=p[1],rounds=p[2];
    b.push({t:'Warm up: 5 min brisk walk',n:0,m:5,d:false});
    for(i=1;i<=rounds;i++) b.push({t:w>0?'Round '+i+': run '+r+' min, walk '+w+' min':'Run '+r+' min steady',n:0,m:r+w,d:false});
    b.push({t:'Cool down: 5 min easy walk',n:0,m:5,d:false});
    return {blocks:b,rest:0,
      sum:w>0?rounds+' rounds of run '+r+' min, walk '+w+' min':'Run '+r+' min steady',
      more:'About '+(10+rounds*(r+w))+' min with warm up and cool down. Run slowly enough that you could still talk.'};
  }
  if(p.s){
    b.push({t:'Easy ride, '+p.s+' min',n:0,m:p.s,d:false});
    return {blocks:b,rest:0,sum:'Easy ride, '+p.s+' min',more:'Stay at a pace where you could hold a conversation.'};
  }
  b.push({t:'Warm up: '+p.w+' min easy',n:0,m:p.w,d:false});
  for(i=1;i<=p.r;i++) b.push({t:'Round '+i+': hard '+p.h+' min, easy '+p.e+' min',n:0,m:p.h+p.e,d:false});
  b.push({t:'Cool down: '+p.c+' min easy',n:0,m:p.c,d:false});
  return {blocks:b,rest:0,
    sum:p.r+' rounds of hard '+p.h+' min, easy '+p.e+' min',
    more:'About '+(p.w+p.r*(p.h+p.e)+p.c)+' min with warm up and cool down. Hard means you can only say a few words.'};
}
function startCardio(act){
  var c=state.cardio,s=null;
  c.sessions=c.sessions.filter(function(x){return x.done||x.week===state.week;});
  c.sessions.forEach(function(x){if(x.act===act&&!x.done) s=x;});
  if(!s){
    var step=c.step[act],pl=cplan(act,step);
    if(!pl) return;
    s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),week:state.week,act:act,date:curDay(),step:step,rest:pl.rest,blocks:pl.blocks,dist:'',note:'',done:false,du:c.du};
    if(act==='swim'){s.L=c.pool.len;s.u=c.pool.unit;}
    c.sessions.push(s);save();
  }
  ui.tab='cardio';ui.cardio=act;ui.csess=s.id;
  render();window.scrollTo(0,0);
}
function pruneCardio(id){
  var c=state.cardio,s=getCS(id);
  if(!s||s.done) return;
  var used=s.blocks.some(function(b){return b.d;})||s.note||s.dist;
  if(!used){c.sessions=c.sessions.filter(function(x){return x.id!==id;});save();}
}
function finishCardio(id){
  var c=state.cardio,s=getCS(id);
  if(!s) return;
  if(!s.blocks.some(function(b){return b.d;})){toast('Check off at least one block first');return;}
  var all=s.blocks.every(function(b){return b.d;});
  s.done=true;s.finished=today();s.complete=all;
  if(s.step===c.step[s.act]) c.streak[s.act]=all?c.streak[s.act]+1:0;
  save();ui.csess=null;render();window.scrollTo(0,0);
  toast(all&&c.streak[s.act]>=2?'Two clean sessions in a row. You move up next week.':'Session saved');
}
function csum(s){
  var dn=s.blocks.filter(function(b){return b.d;});
  if(!dn.length) return 'nothing logged';
  var v=0;
  if(s.act==='swim'){
    dn.forEach(function(b){v+=Number(b.n)||0;});
    if(!v) return dn.reduce(function(a,b){return a+(Number(b.m)||0);},0)+' min';
    return v+(v===1?' length':' lengths')+', '+(Math.round(v*(s.L||0)*10)/10)+' '+(s.u||'');
  }
  dn.forEach(function(b){v+=Number(b.m)||0;});
  return v+' min'+(s.dist?', '+s.dist+' '+(s.du||'km'):'');
}
function cweek(n,act){
  var v=0,any=false,u='min';
  state.cardio.sessions.forEach(function(s){
    if(s.week!==n||s.act!==act||!s.done) return;
    s.blocks.forEach(function(b){
      if(!b.d) return;
      if(act==='swim'){v+=(Number(b.n)||0)*(s.L||0);u=s.u||'';}
      else v+=Number(b.m)||0;
      any=true;
    });
  });
  return any?{v:Math.round(v*10)/10,u:u}:null;
}
function csug(act){
  var c=state.cardio,step=c.step[act],max=CARDIO[act].steps.length-1;

  return {k:'hold',txt:'Repeat'};
}

/* ---------- progression ---------- */
function sug(m){
  var p=state.plan[m.id],v=V(m,p.lv);
  var ses=state.sessions.filter(function(s){return s.week===state.week&&s.ex[m.id]&&s.ex[m.id].lv===p.lv;});
  if(!ses.length) return {k:'none',next:p,txt:'No log yet'};
  var ok=false;
  ses.forEach(function(s){
    var e=s.ex[m.id];
    var hits=e.sets.filter(function(x){return x.d&&Number(x.v)>=e.tgt;}).length;
    if(hits>=e.ps) ok=true;
  });
  if(!ok) return {k:'hold',next:p,txt:'Repeat'};
  var st=stepOf(v);
  if(p.tgt<v[3]){
    var t=Math.min(v[3],p.tgt+st);
    return {k:'reps',next:{lv:p.lv,sets:p.sets,tgt:t},txt:'+'+(t-p.tgt)+' '+unitWord(v[1])};
  }
  if(p.sets<MAXSETS) return {k:'sets',next:{lv:p.lv,sets:p.sets+1,tgt:v[2]},txt:'Add a set'};
  if(p.lv<m.lv.length-1){var nv=m.lv[p.lv+1];return {k:'level',next:{lv:p.lv+1,sets:MINSETS,tgt:nv[2]},txt:'Level up'};}

  var plans={};
  MOVES.forEach(function(m){
    var sg=sug(m);

  });
  Object.keys(plans).forEach(function(k){state.plan[k]=plans[k];});
  ACTS.forEach(function(a){

    if(cs.k==='level'&&!state.holds['c-'+a]){state.cardio.step[a]+=1;state.cardio.streak[a]=0;}

function rollWeeks(){

  var changed=false,guard=0;
  while(guard<80&&weekEnd(state.week)<today()){
    stepWeek(addDays(weekEnd(state.week),1));
    changed=true;guard++;
  }
  if(changed){
    save();
    ui.notice='Week '+state.week+' started on '+fmtDate(weekStart(state.week))+'. Any progress you earned last week is now in your targets.';
  }
  return changed;
}

function reviewCard(){
  var W=state.week,ws=weekStart(W),lim=weekEnd(W)<today()?weekEnd(W):today(),pb=0,dn=0,days=0,sets=0,d=ws;
  while(d<=lim){
    var dd=d;
    blocksFor(dd).forEach(function(t){pb++;if(blockDone(dd,t)) dn++;});
    if(dayActive(dd)) days++;
    d=addDays(d,1);
  }
  state.sessions.forEach(function(x){if(x.week===W) Object.keys(x.ex).forEach(function(k){sets+=x.ex[k].sets.filter(function(y){return y.d;}).length;});});
  var up=[],rp=[];
  MOVES.forEach(function(m){var g=sug(m),nm=V(m,state.plan[m.id].lv)[0];if(moving(g)) up.push(nm);else if(g.k==='hold') rp.push(nm);});
  var cm=0,pm=0;

    if(!x.done) return;
    var t=0;x.blocks.forEach(function(b){if(b.d) t+=Number(b.m)||0;});
    if(x.week===W) cm+=t;else if(x.week===W-1) pm+=t;

  return '<section class="card warn"><h2 class="dph">'+(dow(today())===0?'Week review':'Week so far')+': '+head+'</h2><p>'+dn+' of '+pb+' planned blocks done ('+pct+'%), '+days+' active days, '+sets+' strength sets.</p>'+

  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Total per week bar chart">'+g+'</svg>';
}

function viewProgress(){
  var W=state.week;
  var finished=state.sessions.filter(function(s){return s.week===W&&s.done;}).length;
  var h='<h1 class="pg">Progress</h1><div style="margin-top:14px"></div>'+reviewCard();
  if(ui.noStore) h+='<div class="card warn" style="margin-top:14px"><p>Saving is turned off in this view, so your log will be lost when you close the page. Use Export backup below to keep it.</p></div>';

  // next week
  h+='<h2 class="sec">Week '+W+' to Week '+(W+1)+'</h2><section class="card"><p class="mu">'+finished+' of '+DAYS.length+' workouts finished. Hit every set at your target and the app adds reps, then a set, then moves you to a harder version. This happens by itself when Week '+(W+1)+' starts on '+esc(fmtDate(addDays(weekEnd(W),1)))+'. Tap Hold on anything you want to repeat.</p>';
  DAYS.forEach(function(d){
    h+='<h3 class="grp">'+d.name+'</h3>'+MOVES.filter(function(m){return m.day===d.id;}).map(sugRow).join('');
  });
  h+='<h3 class="grp">Cardio</h3>'+ACTS.map(csugRow).join('');
  if(ui.confirm==='advance'){
    h+='<p style="margin-top:16px">Start Week '+(W+1)+' today instead of waiting for '+esc(fmtDate(addDays(weekEnd(W),1)))+'?</p><div class="row"><button class="btn pri" data-a="advance-go">Start Week '+(W+1)+'</button><button class="btn" data-a="cancel">Cancel</button></div>';
  }else{
    h+='';
  }
  h+='</section>';

  // chart + table
  var ws=state.weeks.slice(-12);
  var cm=ui.chart&&moveById[ui.chart]?ui.chart:MOVES[0].id;
  var cmv=moveById[cm];
  var vals=ws.map(function(w){return weekTotal(w.n,cm)||0;});
  var any=vals.some(function(v){return v>0;});
  h+='<h2 class="sec">Totals by week</h2><section class="card"><select data-chart aria-label="Exercise">'+
    MOVES.map(function(m){return '<option value="'+m.id+'"'+(m.id===cm?' selected':'')+'>'+esc(dayName(m.day)+': '+m.slot)+'</option>';}).join('')+'</select>'+
    (any?chartSVG(vals,ws.map(function(w){return 'W'+w.n;})):'<p class="mu" style="margin-top:12px">Log a workout and your totals show up here.</p>')+
    '<p class="mu" style="margin-top:8px;font-size:14px">Every logged set added together, in reps (seconds for holds). Now: '+esc(V(cmv,state.plan[cm].lv)[0])+'.</p></section>';

  h+='<section class="card"><div class="tw"><table><thead><tr><th>Exercise</th>'+ws.map(function(w){return '<th class="'+(w.n===W?'cur':'')+'">W'+w.n+'</th>';}).join('')+'</tr></thead><tbody>';
  DAYS.forEach(function(d){
    h+='<tr class="g"><td colspan="'+(ws.length+1)+'">'+d.name+'</td></tr>';
    MOVES.filter(function(m){return m.day===d.id;}).forEach(function(m){
      h+='<tr><td>'+esc(m.slot)+'</td>'+ws.map(function(w){
        var t=weekTotal(w.n,m.id),u=V(m,lvAt(w.n,m.id))[1],up=w.n>1&&lvAt(w.n,m.id)>lvAt(w.n-1,m.id);
        return '<td class="'+(w.n===W?'cur':'')+'">'+(t===null?'<span class="mu">-</span>':t+(u==='sec'?'s':''))+(up?'<sup class="up" title="Moved up a level">\u25b2</sup>':'')+'</td>';
      }).join('')+'</tr>';
    });
  });
  h+=cardioRows();
  h+='</tbody></table></div><p class="mu" style="margin-top:8px;font-size:14px">\u25b2 means you moved up a level that week.'+(state.weeks.length>12?' Showing the latest 12 weeks.':'')+'</p></section>';

  // history
  h+='<h2 class="sec">History</h2><section class="card" style="padding:6px 14px">';
  var shown=0;
  for(var n=W;n>=1;n--){
    var ss=state.sessions.filter(function(s){return s.week===n;});
    var cs=state.cardio.sessions.filter(function(x){return x.week===n&&x.done;});
    if(!ss.length&&!cs.length&&n!==W) continue;
    shown++;
    var fin=ss.filter(function(s){return s.done;}).length;
    var sets=0;ss.forEach(function(s){Object.keys(s.ex).forEach(function(k){sets+=s.ex[k].sets.filter(function(x){return x.d;}).length;});});
    var open=!!ui.openWeeks[n];
    h+='<button class="wkb" data-a="week" data-w="'+n+'" aria-expanded="'+(open?'true':'false')+'"><b>Week '+n+'</b><span>'+(ss.length||cs.length?fin+' finished, '+sets+' sets'+(cs.length?', '+cs.length+' cardio':''):'No workouts yet')+'</span></button>';
    if(open){
      var items=[];
      ss.forEach(function(x){items.push({d:x.date||'',k:'s',x:x});});
      cs.forEach(function(x){items.push({d:x.date||'',k:'c',x:x});});
      items.sort(function(p1,p2){return p1.d<p2.d?1:(p1.d>p2.d?-1:0);});
      h+='<div class="hse"><p class="mu">'+esc(fmtDate(weekStart(n)))+' to '+esc(fmtDate(weekEnd(n)))+'</p></div>';
      if(!items.length) h+='<div class="hse"><p class="mu">Nothing logged this week.</p></div>';
      items.forEach(function(it){
        var x=it.x;
        if(it.k==='c'){
          h+='<div class="hse"><p><b>'+cname(x.act)+'</b> <span class="mu">'+esc(fmtLong(x.date))+(x.complete?', finished':', cut short')+'</span></p><ul><li><span class="mu">'+esc(csum(x))+'</span>'+(x.note?'<em>'+esc(x.note)+'</em>':'')+'</li></ul></div>';
        }else{
          h+='<div class="hse"><p><b>'+dayName(x.day)+'</b> <span class="mu">'+esc(fmtLong(x.date))+(x.done?', finished':', not finished')+'</span></p><ul>'+
            Object.keys(x.ex).map(function(k){
              var e=x.ex[k],dn=e.sets.filter(function(y){return y.d;});
              return '<li><span>'+esc(e.name)+'</span> <span class="mu">'+(dn.length?dn.map(function(y){return y.v;}).join(', ')+' '+unitWord(e.unit):'no sets logged')+'</span>'+(e.note?'<em>'+esc(e.note)+'</em>':'')+'</li>';
            }).join('')+'</ul></div>';
        }
      });
    }
  }
  h+='</section>';

  // data
  h+='<h2 class="sec">Your data</h2><section class="card"><p class="mu">Your log is saved in this browser on this device. Export a backup before you clear site data or switch phones.</p><div class="row"><button class="btn" data-a="export">Export backup</button><button class="btn" data-a="import-open">Restore backup</button></div>';
  if(ui.exportText) h+='<textarea id="exp" class="blob" readonly rows="6">'+esc(ui.exportText)+'</textarea><div class="row"><button class="btn sm" data-a="copy">Copy</button><button class="btn sm ghost" data-a="export-close">Close</button></div><p class="mu" style="margin-top:8px;font-size:14px">Paste this into a note you keep. Restore backup takes it back.</p>';
  if(ui.showImport) h+='<textarea id="imp" class="blob" rows="6" placeholder="Paste backup text here"></textarea><div class="row"><button class="btn sm pri" data-a="import">Replace my data</button><button class="btn sm ghost" data-a="import-close">Cancel</button></div>';
  h+='<div class="row" style="margin-top:20px">';
  if(ui.confirm==='reset') h+='<p style="width:100%">This deletes every workout and starts over at Week 1.</p><button class="btn danger" data-a="reset-go">Erase everything</button><button class="btn" data-a="cancel">Cancel</button>';
  else h+='<button class="btn danger" data-a="reset-ask">Erase all data</button>';
  h+='</div></section>';
  return h;
}

function startHTML(){
  var opts=[
    ['Beginner','Incline push-ups, squats, floor-based pulling. Build the base.'],
    ['Intermediate','Full push-ups, split squats, inverted rows.'],
    ['Advanced','Archer push-ups, pistol squats, pull-ups.']
  ];
  return '<div class="in"><div class="logo big">'+ic('pull')+'</div><h1>Pick your starting level</h1><p>Choose the level where you can finish every rep with clean form. You can change each exercise later in Plan.</p>'+
    opts.map(function(o,i){return '<button class="pick" data-a="start" data-l="'+i+'"><b>'+o[0]+'</b><span>'+o[1]+'</span></button>';}).join('')+'</div>';
}

function render(){
  rollWeeks();
  var y=window.scrollY||0;
  var html;
  try{
    html=ui.tab==='plan'?viewPlan():ui.tab==='progress'?viewProgress():ui.tab==='cardio'?viewCardio():viewToday();
  }catch(err){
    html='<div class="card"><h2 class="sec" style="margin-top:0">Something went wrong</h2><p class="mu">This page hit a problem reading your saved data. Erasing it will fix that.</p><div class="row"><button class="btn danger" data-a="reset-go">Erase everything</button></div></div>';
  }
  $('#app').innerHTML=html;
  var bs=document.querySelectorAll('#tabs button');
  for(var i=0;i<bs.length;i++){
    var on=bs[i].getAttribute('data-t')===ui.tab;
    bs[i].classList.toggle('on',on);
    bs[i].setAttribute('aria-current',on?'page':'false');
  }
  var st=$('#start');
  if(!state.started){st.hidden=false;st.innerHTML=startHTML();}
  else{st.hidden=true;st.innerHTML='';}
  window.scrollTo(0,y);
}

/* ---------- rest timer ---------- */
var timer=null,actx=null;
function fmtT(s){return Math.floor(s/60)+':'+pad(s%60);}
function primeAudio(){
  try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC) return;actx=actx||new AC();if(actx.resume) actx.resume();}catch(e){}
}
function beep(){
  try{if(navigator.vibrate) navigator.vibrate([120,60,120]);}catch(e){}
  try{
    if(!actx) return;
    var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.connect(g);g.connect(actx.destination);o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o.start(t);o.stop(t+0.55);
  }catch(e){}
}
function startRest(sec){timer={end:Date.now()+sec*1000,total:sec};primeAudio();tick();}
function tick(){
  var el=$('#rest');
  if(!el) return;
  if(!timer){el.hidden=true;return;}
  var now=Date.now();
  if(timer.fin){if(now>timer.fin+3000){timer=null;el.hidden=true;}return;}
  var left=Math.max(0,Math.ceil((timer.end-now)/1000));
  el.hidden=false;el.classList.remove('fin');
  $('#restT').textContent=fmtT(left);
  $('#restBar').style.width=Math.min(100,Math.max(0,100*(1-left/timer.total)))+'%';
  if(left<=0){timer.fin=now;$('#restT').textContent='Go';el.classList.add('fin');beep();}
}

/* ---------- toast ---------- */
var toastT=null;
function toast(msg){
  var t=$('#toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2200);
}

/* ---------- export / import ---------- */
function doExport(){
  var data=JSON.stringify(state,null,2);
  if(!ui.dl){
    try{
      var bl=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(bl),an=document.createElement('a');
      an.href=u;an.download='bodyweight-tracker-backup.json';document.body.appendChild(an);an.click();an.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},2000);toast('Backup saved');return;
    }catch(e){}
  }
  if(ui.dl){
    ui.dl.save({filename:'bodyweight-tracker-backup.json',data:data}).then(function(){toast('Backup saved');},function(err){
      if(err&&err.code==='declined') return;
      ui.exportText=data;render();
    });
    return;
  }
  ui.exportText=data;render();
}

/* ---------- actions ---------- */
function act(a,d){
  var e,x,m,cc,cs2,cb,cel,cv;
  switch(a){
    case 'tab':
      if(d.t==='cardio'&&(ui.tab==='cardio'||!ui.csess)){ui.cardio=null;ui.csess=null;ui.editPool=false;}
      ui.tab=d.t;ui.confirm=null;render();window.scrollTo(0,0);break;
    case 'start':
      MOVES.forEach(function(mv){state.plan[mv.id]=rx(mv,(mv.st||[0,1,2])[+d.l]);});
      state.weeks[state.weeks.length-1].plan=clone(state.plan);
      state.started=true;save();render();window.scrollTo(0,0);break;
    case 'open':
      startSession(d.day);break;
    case 'back':
      if(ui.open) pruneIfEmpty(ui.open);
      ui.open=null;render();window.scrollTo(0,0);break;
    case 'set':
      e=getEx(d.s,d.m);if(!e) break;
      x=e.sets[+d.i];if(!x) break;
      x.d=!x.d;save();
      if(x.d) startRest(state.rest);
      render();break;
    case 'step':
      e=getEx(d.s,d.m);if(!e) break;
      x=e.sets[+d.i];if(!x) break;
      x.v=Math.max(0,Math.min(999,(Number(x.v)||0)+(+d.n)*(e.unit==='sec'?5:1)));
      save();render();break;
    case 'add-set':
      e=getEx(d.s,d.m);if(!e) break;
      e.sets.push({d:false,v:e.sets.length?e.sets[e.sets.length-1].v:e.tgt});
      save();render();break;
    case 'rm-set':
      e=getEx(d.s,d.m);if(!e||e.sets.length<2) break;
      e.sets.pop();save();render();break;
    case 'finish':
      state.sessions.forEach(function(s){if(s.id===d.s){s.done=true;s.finished=today();}});
      save();ui.open=null;render();window.scrollTo(0,0);toast('Workout saved');break;
    case 'rest-cycle':
      state.rest=RESTS[(RESTS.indexOf(state.rest)+1)%RESTS.length];save();render();break;
    case 'rest-add':
      if(timer&&!timer.fin){
        timer.end+=(+d.n)*1000;
        var left=Math.ceil((timer.end-Date.now())/1000);
        if(left<=0){timer.end=Date.now()+1000;left=1;}
        timer.total=Math.max(timer.total,left);tick();
      }
      break;
    case 'rest-skip':
      timer=null;tick();break;
    case 'lvl':
      m=moveById[d.m];if(!m) break;
      state.plan[m.id]=rx(m,+d.l);
      var w=state.weeks[state.weeks.length-1];
      if(w) w.plan[m.id]=clone(state.plan[m.id]);
      save();render();break;
    case 'hold':
      state.holds[d.m]=!state.holds[d.m];render();break;
    case 'advance':
      ui.confirm='advance';render();break;
    case 'advance-go':
      advance();break;
    case 'cancel':
      ui.confirm=null;render();break;
    case 'week':
      ui.openWeeks[d.w]=!ui.openWeeks[d.w];render();break;
    case 'export':
      doExport();break;
    case 'export-close':
      ui.exportText='';render();break;
    case 'copy':
      var ta=$('#exp');if(!ta) break;
      ta.focus();ta.select();
      var ok=false;
      try{ok=document.execCommand('copy');}catch(err){}
      if(ok) toast('Copied');
      else if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(function(){toast('Copied');},function(){toast('Select the text and copy it');});
      else toast('Select the text and copy it');
      break;
    case 'import-open':
      ui.showImport=true;render();break;
    case 'import-close':
      ui.showImport=false;render();break;
    case 'import':
      var box=$('#imp'),raw;
      if(!box) break;
      try{raw=JSON.parse(box.value);}catch(err){toast('That is not valid backup text');break;}
      if(!raw||typeof raw!=='object'||!raw.plan||!Array.isArray(raw.sessions)){toast('That backup is missing data');break;}
      state=normalize(raw);state.started=true;
      ui.showImport=false;ui.open=null;state.holds={};save();render();window.scrollTo(0,0);toast('Backup restored');break;
    case 'qc-open':
      ui.qc=ui.qc?null:{act:'run'};render();break;
    case 'qc-act':
      if(ui.qc){var qm=$('#qcm');ui.qc.m=qm?qm.value:'';ui.qc.act=d.act;}
      render();break;
    case 'qc-save':
      saveQuick();break;
    case 'xadd':
      var xd=curDay();state.extra[xd]=(state.extra[xd]||[]).concat(d.t);save();render();break;
    case 'pick-day':
      ui.day=d.date;render();break;
    case 'notice-x':
      ui.notice='';render();break;
    case 'open-s':
      ui.tab='today';ui.open=d.s;render();window.scrollTo(0,0);break;
    case 'cact':
      ui.cardio=d.act;ui.csess=null;ui.editPool=false;render();window.scrollTo(0,0);break;
    case 'cback':
      ui.cardio=null;ui.csess=null;ui.editPool=false;render();window.scrollTo(0,0);break;
    case 'cleave':
      pruneCardio(ui.csess);ui.csess=null;render();window.scrollTo(0,0);break;
    case 'cstart':
      startCardio(d.act);break;
    case 'cstep':
      cc=state.cardio;
      cc.step[d.act]=Math.max(0,Math.min(CARDIO[d.act].steps.length-1,cc.step[d.act]+(+d.n)));
      cc.streak[d.act]=0;save();render();break;
    case 'cset':
      cs2=getCS(d.s);if(!cs2) break;
      cb=cs2.blocks[+d.i];if(!cb) break;
      cb.d=!cb.d;save();
      if(cb.d&&cs2.rest>0) startRest(cs2.rest);
      render();break;
    case 'cstp':
      cs2=getCS(d.s);if(!cs2) break;
      cb=cs2.blocks[+d.i];if(!cb) break;
      cb.n=Math.max(1,Math.min(200,(Number(cb.n)||1)+(+d.n)));save();render();break;
    case 'cfinish':
      finishCardio(d.s);break;
    case 'cdu':
      cc=state.cardio;cc.du=cc.du==='km'?'mi':'km';
      cs2=getCS(ui.csess);if(cs2) cs2.du=cc.du;
      save();render();break;
    case 'pool-edit':
      ui.pd={len:state.cardio.pool?state.cardio.pool.len:25,unit:state.cardio.pool?state.cardio.pool.unit:'m'};
      ui.editPool=true;render();break;
    case 'pool-cancel':
      ui.editPool=false;render();break;
    case 'pool-unit':
      cel=$('#poolLen');if(cel&&parseFloat(cel.value)>=10) ui.pd.len=parseFloat(cel.value);
      ui.pd.unit=d.u;render();break;
    case 'pool-len':
      ui.pd.len=+d.n;render();break;
    case 'pool-save':
      cel=$('#poolLen');cv=cel?parseFloat(cel.value):NaN;
      if(isNaN(cv)||cv<10||cv>100){toast('Enter a length between 10 and 100');break;}
      state.cardio.pool={len:Math.round(cv*10)/10,unit:ui.pd.unit};
      ui.editPool=false;save();render();toast('Pool length saved');break;
    case 'reset-ask':
      ui.confirm='reset';render();break;
    case 'reset-go':
      try{localStorage.removeItem(KEY);}catch(err){}
      state=freshState();
      ui.open=null;state.holds={};ui.confirm=null;ui.exportText='';ui.showImport=false;ui.openWeeks={};ui.tab='today';ui.cardio=null;ui.csess=null;ui.editPool=false;
      timer=null;tick();render();window.scrollTo(0,0);break;
  }
}

document.addEventListener('click',function(ev){
  var t=ev.target&&ev.target.closest?ev.target.closest('[data-a]'):null;
  if(!t) return;
  act(t.getAttribute('data-a'),t.dataset);
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(!t||!t.matches) return;
  if(t.matches('input[data-val]')){
    var e=getEx(t.dataset.s,t.dataset.m);if(!e) return;
    var x=e.sets[+t.dataset.i];if(!x) return;
    var v=parseInt(t.value,10);
    if(isNaN(v)||v<0) v=0;
    if(v>999) v=999;
    x.v=v;t.value=v;save();
  }else if(t.matches('select[data-sched]')){
    var row=(state.sched[+t.dataset.d]||[]).slice();
    row[+t.dataset.i]=t.value==='none'?'':t.value;
    state.sched[+t.dataset.d]=row.filter(function(v2,i2){return v2&&row.indexOf(v2)===i2;});
    save();render();
  }else if(t.matches('input[data-sdate]')){
    var tg=t.dataset.k==='c'?getCS(t.dataset.s):sById(t.dataset.s);
    if(tg){
      var lo=weekStart(tg.week),hi=weekEnd(tg.week);
      if(today()<hi) hi=today();
      if(t.value>=lo&&t.value<=hi){tg.date=t.value;ui.day=t.value;save();}
      else{toast('Pick a day in that week, up to today');t.value=tg.date;}
    }
  }else if(t.matches('input[data-cdist]')){
    var cs=getCS(t.dataset.s);
    if(cs){var dv=parseFloat(t.value);cs.dist=(isNaN(dv)||dv<=0)?'':String(Math.round(dv*100)/100);t.value=cs.dist;save();}
  }else if(t.matches('select[data-chart]')){
    ui.chart=t.value;render();
  }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t&&t.matches&&t.matches('textarea[data-note]')){
    var e=getEx(t.dataset.s,t.dataset.m);
    if(e){e.note=t.value.slice(0,500);saveSoon();}
  }
});
document.addEventListener('focusout',function(ev){
  var t=ev.target;
  if(t&&t.matches&&t.matches('textarea[data-note]')) save();
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t&&t.matches&&t.matches('textarea[data-cnote]')){
    var s=getCS(t.dataset.s);
    if(s){s.note=t.value.slice(0,500);saveSoon();}
  }
});
document.addEventListener('focusout',function(ev){
  var t=ev.target;
  if(t&&t.matches&&t.matches('textarea[data-cnote]')) save();
});
window.addEventListener('pagehide',function(){try{save();}catch(e){}});
document.addEventListener('visibilitychange',function(){tick();if(!document.hidden&&rollWeeks()) render();});

try{
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(d){ui.dl=d||null;},function(){});
  }
}catch(e){}

setInterval(tick,250);
render();
})();
